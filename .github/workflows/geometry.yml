name: Geometry invariants
on: [push, pull_request]
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow scipy pytest
      - run: python -m pytest -q tests
